name: Build Windows Installer

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller scheduler.spec

      - name: Show dist contents
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Create launcher batch file
        shell: cmd
        run: |
          echo @echo off > dist\NanaScheduler\start.bat
          echo cd /d "%%~dp0" >> dist\NanaScheduler\start.bat
          echo timeout /t 2 /nobreak ^> nul >> dist\NanaScheduler\start.bat
          echo start http://127.0.0.1:5001 >> dist\NanaScheduler\start.bat
          echo NanaScheduler.exe >> dist\NanaScheduler\start.bat

      - name: Zip the output
        run: |
          cd dist
          Compress-Archive -Path NanaScheduler -DestinationPath NanaScheduler-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanaScheduler-Windows
          path: dist/NanaScheduler-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if:
startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NanaScheduler-Windows.zip
          generate_release_notes: true
