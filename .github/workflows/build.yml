name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask ortools openpyxl pyinstaller

      - name: Show project structure
        run: Get-ChildItem -Recurse | Select-Object FullName

      - name: Build with PyInstaller
        run: pyinstaller scheduler.spec --log-level DEBUG 2>&1

      - name: Show dist contents
        run: |
          if (Test-Path dist) {
            Get-ChildItem -Recurse dist | Select-Object FullName
          } else {
            Write-Output "dist/ folder does not exist"
          }

      - name: Create launcher
        run: python create_launcher.py

      - name: Zip the output
        run: Compress-Archive -Path dist/NanaScheduler -DestinationPath dist/NanaScheduler-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanaScheduler-Windows
          path: dist/NanaScheduler-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NanaScheduler-Windows.zip
          generate_release_notes: true
